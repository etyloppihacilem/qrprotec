# Wifi de secours de la borne (qrprotec-hotspot.service, menu TECH > Wifi de secours du poste).
# Tout est facultatif. Apres modification : arreter puis relancer le wifi de secours depuis le poste.
# Fichier preserve par les mises a jour (%config(noreplace)).

# Nom du wifi diffuse
#QRPROTEC_HOTSPOT_SSID=QRprotec
# Mot de passe (8 a 63 caracteres). Par defaut : tire au hasard au premier lancement, garde dans
# /var/lib/qrprotec-hotspot/password (les telephones deja connectes s'y reconnectent seuls).
#QRPROTEC_HOTSPOT_PASSWORD=
# Carte wifi (par defaut : la premiere vue par NetworkManager, nmcli device)
#QRPROTEC_HOTSPOT_IFACE=wlan0
# Adresse de la borne sur ce wifi (/24), quand le site a un nom (si le site est une adresse IP, c'est elle)
#QRPROTEC_HOTSPOT_ADDRESS=10.42.0.1
