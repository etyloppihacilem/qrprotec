# Sauvegardes automatiques de QRProtec (qrprotec-backup.timer). Le plus simple : sudo qrprotec-setup
# Apres modification a la main : sudo qrprotec-backup --apply-schedule
# Fichier preserve par les mises a jour (%config(noreplace)).

# Dossier des archives qrprotec-backup_AAAA-MM-JJ_HHMMSS.tar.xz (cree en 0700 root). Idealement sur
# un autre disque (montage USB, NAS...) que la base.
QRPROTEC_BACKUP_DIR=/var/backups/qrprotec

# Nombre d'archives conservees (les plus anciennes sont supprimees ; 0 = toutes)
QRPROTEC_BACKUP_KEEP=14

# Frequence : hourly, daily, weekly, monthly, une expression OnCalendar de systemd
# (ex. "*-*-* 03:30:00", voir `man systemd.time`), ou off
QRPROTEC_BACKUP_SCHEDULE=daily

# Copie des archives sur une autre machine apres chaque sauvegarde, par rsync sur SSH (rsync installe sur les deux
# machines). Le plus simple : sudo qrprotec-setup --backup-sync utilisateur@machine:/dossier (cree la cle SSH
# /etc/qrprotec/backup_ssh_key a autoriser la-bas, puis enregistre la machine a la premiere connexion).
# Vide : pas d'envoi. Essai a la main : sudo qrprotec-backup --sync
#QRPROTEC_BACKUP_SYNC_TARGET=sauvegarde@nas:/srv/qrprotec
#QRPROTEC_BACKUP_SYNC_PORT=22
# yes : miroir (les archives supprimees ici par la rotation le sont aussi la-bas) ; no : tout garder la-bas
#QRPROTEC_BACKUP_SYNC_DELETE=yes
