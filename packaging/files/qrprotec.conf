# Configuration de QRProtec, lue par le back (qrprotec.service) ET par Caddy.
# Format KEY=valeur (pas d'espace autour du =). Apres modification :
#   sudo systemctl restart qrprotec.service caddy.service
# ou plus simplement : sudo qrprotec-setup
#
# Ce fichier est preserve par les mises a jour (%config(noreplace)).

# Nom d'hote public de la borne (nom DNS ou adresse IP), unique endroit ou il est defini :
# il sert au site Caddy, a ALLOWED_HOSTS de Django et a la base des URLs des QR codes.
QRPROTEC_DOMAIN=localhost

# Certificat HTTPS de Caddy : "internal" (autorite locale de Caddy, reseau local ou adresse IP)
# ou une adresse e-mail pour obtenir un certificat Let's Encrypt (nom de domaine public joignable
# sur les ports 80 et 443).
QRPROTEC_TLS=internal

# Ports d'ecoute du back (toujours sur 127.0.0.1). L'API publique est proxifiee par Caddy, l'API
# locale ne sert qu'au front de cette machine, l'API distante (proxifiee par Caddy pour les requetes
# avec une cle de front) aux fronts d'autres machines : sudo qrprotec-setup --front-key NOM
QRPROTEC_PUBLIC_API_PORT=8000
QRPROTEC_LOCAL_API_PORT=8001
QRPROTEC_REMOTE_API_PORT=8002

# Valeurs deduites de QRPROTEC_DOMAIN si elles sont vides ou absentes :
#QRPROTEC_PUBLIC_BASE_URL=https://inventaire.example.org/
#QRPROTEC_ALLOWED_HOSTS=inventaire.example.org,localhost,127.0.0.1,[::1]

# Jeton optionnel de l'API locale (a reporter dans api_token du front, ~qrprotec-kiosk/.config/qrprotec/app.conf)
#QRPROTEC_LOCAL_API_TOKEN=

# Regles de gestion
#QRPROTEC_MISSING_AFTER_VERIFS=3
#QRPROTEC_LOT_KEY_VALIDITY_DAYS=3650
# Jours avant l'expiration d'une etiquette privee de lot ou d'un badge pour l'alerte « expire bientot »
#QRPROTEC_KEY_EXPIRY_WARNING_DAYS=30
#QRPROTEC_SMS_SYNC=0
# PIN faux (depuis le dernier PIN correct) avant un blocage que seul un administrateur leve
#QRPROTEC_PIN_BLOCK_AFTER_FAILURES=50

# Contact annonce aux services de notifications web (mailto:... ou https://...) ; defaut : PUBLIC_BASE_URL
#QRPROTEC_WEB_PUSH_SUBJECT=mailto:admin@example.org

# Ne jamais activer en production
QRPROTEC_DEBUG=0

# La cle secrete de Django n'est PAS ici : elle est generee a l'installation dans
# /etc/qrprotec/secret_key (0640 root:qrprotec), jamais remplacee par les mises a jour.
