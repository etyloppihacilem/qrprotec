# Connexion du front du kiosk (qrprotec-kiosk.service) a un back sur une AUTRE machine. Le plus simple :
#   sudo qrprotec-setup --api-url https://inventaire.example.org --api-key qrpf_...
# Apres modification a la main : sudo systemctl restart qrprotec-kiosk.service
# Fichier preserve par les mises a jour (%config(noreplace)), lisible par root seulement (cle).
#
# Tout commente (defaut) : le front utilise l'API locale de cette machine (http://127.0.0.1:8001, port
# non expose), comme une borne qui fait tourner le back elle-meme. Ces valeurs priment sur celles de
# Reglages > Serveur du front.

# URL HTTPS du serveur (QRPROTEC_DOMAIN du back)
#QRPROTEC_API_URL=https://inventaire.example.org

# Cle de ce front, creee sur le serveur : sudo qrprotec-manage frontkey add NOM
#QRPROTEC_API_KEY=

# Certificat de l'autorite du serveur (PEM), si le back utilise l'autorite interne de Caddy
# (QRPROTEC_TLS=internal) ; vide : autorites du systeme (Let's Encrypt...)
#QRPROTEC_API_CA_FILE=/etc/qrprotec/server-ca.crt
