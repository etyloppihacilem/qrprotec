# Environnement du kiosk (qrprotec-kiosk.service, Cage sur tty1). Apres modification :
#   sudo systemctl restart qrprotec-kiosk.service
# Fichier preserve par les mises a jour (%config(noreplace)).

# Disposition du clavier (et des douchettes en mode clavier HID) : fr, us, ch...
XKB_DEFAULT_LAYOUT=fr
#XKB_DEFAULT_VARIANT=
#XKB_DEFAULT_OPTIONS=

# Extinction de l'ecran apres inactivite, en secondes (0 = jamais). Necessite swayidle, et wlopm
# (DPMS) ou a defaut wlr-randr (sorties desactivees). Une touche ou la souris rallume l'ecran.
# Le retroeclairage (portable, tout-en-un) est aussi coupe, et les moniteurs externes mis en
# veille par DDC/CI si ddcutil est installe.
QRPROTEC_SCREEN_BLANK_SECONDS=1800
# Luminosite du retroeclairage (portable, tout-en-un) en % du maximum, au demarrage et au rallumage
#QRPROTEC_SCREEN_BRIGHTNESS=100
# 0 = ne pas utiliser DDC/CI (moniteur qui ne se rallume plus apres sa mise en veille)
#QRPROTEC_SCREEN_DDC=1

# Dossier des modeles d'etiquettes (*.qr, images/*.png) : par defaut ~qrprotec-kiosk/templates,
# initialise depuis /usr/share/qrprotec/templates (les fichiers modifies ne sont jamais ecrases).
#QRPROTEC_TEMPLATES_DIR=/var/lib/qrprotec-kiosk/templates

# Options du front (debogage : --verbose), journal : journalctl -u qrprotec-kiosk -b
#QRPROTEC_FRONT_ARGS=--verbose
