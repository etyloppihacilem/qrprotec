<!doctype html>
<!-- Page servie par Caddy, sans le back, pendant une maintenance (sudo qrprotec-manage maintenance on).
     Copiee dans /etc/qrprotec/maintenance/index.html a l'activation ; aucune ressource externe (CSP : styles en
     ligne, script du contournement servi a part). Les marqueurs MESSAGE et SALT entre arobases recoivent le message
     facultatif et le sel du code de contournement (vide : contournement desactive). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14284b">
  <meta name="robots" content="noindex, nofollow">
  <title>Maintenance en cours · QRprotec</title>
  <style>
    :root { color-scheme: light dark; --navy: #14284b; --pc-orange: #f39200; --bg: #f4f6fa; --card: #fff; --text: #1d2433; --muted: #5b6475; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1522; --card: #1a2233; --text: #e7ebf3; --muted: #a3acbd; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--navy); color: #fff; border-bottom: 4px solid var(--pc-orange); padding: 14px 16px;
      font-weight: 700; font-size: 20px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { background: var(--card); max-width: 480px; width: 100%; border-radius: 14px; padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08); text-align: center; }
    .icon { font-size: 48px; line-height: 1; }
    h1 { font-size: 24px; margin: 14px 0 8px; }
    p { margin: 8px 0; }
    .muted { color: var(--muted); font-size: 15px; margin-top: 18px; }
    #logo { cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    form { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    form[hidden] { display: none; }
    input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--muted); background: var(--bg);
      color: var(--text); text-align: center; }
    button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--navy);
      color: #fff; }
    @media (prefers-color-scheme: dark) { button { background: #2463b3; } }
    #bypass-error { color: #d93025; font-size: 15px; min-height: 1.5em; margin: 0; }
  </style>
</head>
<body data-salt="@SALT@">
  <header><span id="logo">QRprotec</span></header>
  <main>
    <div class="card">
      <div class="icon" aria-hidden="true">🛠️</div>
      <h1>Maintenance en cours</h1>
      <p>QRprotec n'est pas accessible pour le moment.</p>
      @MESSAGE@
      <p class="muted">Réessayez un peu plus tard.</p>
      <form id="bypass" hidden>
        <input id="bypass-code" type="password" autocomplete="off" aria-label="Code de maintenance" placeholder="Code de maintenance">
        <button type="submit">Entrer</button>
        <p id="bypass-error" role="alert"></p>
      </form>
    </div>
  </main>
  <script src="/qrprotec-maintenance.js"></script>
</body>
</html>
